appId: com.impexum.timeattendance
productName: TimeAttendance
copyright: Copyright © 2026 Impexum

directories:
  output: release
  buildResources: build          # 👈 move icons here

files:
  - dist/**/*
  - electron/**/*
  - package.json

extraMetadata:
  main: electron/main.cjs

# Windows
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: '${productName}-Setup-${version}.${ext}'

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TimeAttendance

# macOS
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.business
  artifactName: '${productName}-${version}.${ext}'
  hardenedRuntime: false
  gatekeeperAssess: false

# Linux
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office
  maintainer: Impexum <info@impexum.com>
  executableName: time-attendance
  artifactName: '${productName}-${version}.${ext}'

publish: null